# PostgreSQL מקומי לפיתוח:  docker compose up -d
# מתאים לברירת המחדל ב-API/appsettings.json (Host=localhost, Database=patientcare, postgres/postgres).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: patientcare
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
